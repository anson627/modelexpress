name: Release container images

on:
  push:
    branches: [internal]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to publish (required for production)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-source:
    if: >-
      github.repository == 'coreweave/modelexpress' &&
      github.ref_type == 'branch' &&
      (github.ref_name == 'internal' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      image-tag: ${{ steps.source.outputs.image-tag }}
    steps:
      - name: Validate source selection
        id: selection
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] ||
               ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
              echo '::error::Release tag must be a valid Git tag and Docker image tag (maximum 128 characters).'
              exit 1
            fi
            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo '::error::Production releases require an existing release_tag.'
            exit 1
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.selection.outputs.ref }}
          persist-credentials: false

      - name: Record source commit and image tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse 'HEAD^{commit}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "image-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "image-tag=sha-$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: resolve-source
    runs-on: ${{ vars.MODELEXPRESS_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: modelexpress-server
            dockerfile: docker/modelexpress-server/Dockerfile
          - image: modelexpress-vllm-runtime
            dockerfile: examples/rl/dynamo_vllm_s3_delta_refit/Dockerfile
    steps:
      - name: Select Artifactory repository
        id: destination
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROD_REPOSITORY: ${{ vars.ARTIFACTORY_OCI_PROD_REPOSITORY }}
          DEV_REPOSITORY: ${{ vars.ARTIFACTORY_OCI_DEV_REPOSITORY }}
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ needs.resolve-source.outputs.image-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            repository="$PROD_REPOSITORY"
          else
            repository="$DEV_REPOSITORY"
          fi
          if [[ -z "$repository" ]]; then
            echo '::error::Artifactory is not provisioned. Merge .cw/artifact-mgmt/config.yaml to the default branch first.'
            exit 1
          fi
          image="artifacts.coreweave.com/$repository/$IMAGE"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout resolved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up JFrog CLI (Artifactory OIDC)
        id: artifactory
        uses: jfrog/setup-jfrog-cli@1e584506871998c267b7c100c02628a5b9c81db6 # v5
        env:
          JF_URL: ${{ vars.ARTIFACTORY_INSTANCE_URL }}
          JF_PROJECT: ${{ vars.ARTIFACTORY_PROJECT_KEY }}
        with:
          oidc-provider-name: ${{ vars.ARTIFACTORY_OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ vars.ARTIFACTORY_OIDC_AUDIENCE }}

      - name: Log in to Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: artifacts.coreweave.com
          username: ${{ steps.artifactory.outputs.oidc-user }}
          password: ${{ steps.artifactory.outputs.oidc-token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.destination.outputs.tag }}
          build-contexts: |
            dynamo=https://github.com/ai-dynamo/dynamo.git#c3e05f0244ae6264d7953f68e2499c6dc2f54723
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}

      - name: Verify published architectures
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] |
              contains(["amd64", "arm64"])'

      - name: Record published image
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          TAG: ${{ steps.destination.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        shell: bash
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "Platforms: linux/amd64, linux/arm64"
            echo
            echo "Source commit: $SOURCE_SHA"
            echo
            echo "Tag: \`$TAG\`"
            echo
            echo "Digest: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
